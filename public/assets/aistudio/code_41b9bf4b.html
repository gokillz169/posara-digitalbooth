<script>
  let currentCountdown = 3;
  let timerInterval = null;
  let timerMode = 3;

  const digitEl = document.getElementById('countdownDigit');
  const flashOverlay = document.getElementById('flashFlashOverlay');
  const shutterBtn = document.getElementById('shutterBtn');
  const timerBtn = document.getElementById('timerBtn');
  const timerLabel = document.getElementById('timerLabel');
  const activeFilterBadge = document.getElementById('activeFilterBadge');
  const camFlipToggle = document.getElementById('camFlipToggle');
  const flashToggle = document.getElementById('flashToggle');
  const previewImg = document.getElementById('livePreviewImg');

  function triggerShutterFlash() {
    if (!flashOverlay) return;
    flashOverlay.classList.remove('opacity-0');
    flashOverlay.classList.add('opacity-90');
    setTimeout(() => {
      flashOverlay.classList.remove('opacity-90');
      flashOverlay.classList.add('opacity-0');
    }, 180);
  }

  function startCountdown() {
    clearInterval(timerInterval);
    currentCountdown = timerMode;
    if (digitEl) digitEl.textContent = currentCountdown;

    timerInterval = setInterval(() => {
      currentCountdown -= 1;
      if (currentCountdown > 0) {
        if (digitEl) digitEl.textContent = currentCountdown;
      } else {
        clearInterval(timerInterval);
        if (digitEl) digitEl.textContent = '📸';
        triggerShutterFlash();
        setTimeout(() => {
          startCountdown();
        }, 1200);
      }
    }, 1000);
  }

  if (shutterBtn) {
    shutterBtn.addEventListener('click', () => {
      triggerShutterFlash();
      startCountdown();
    });
  }

  if (timerBtn) {
    timerBtn.addEventListener('click', () => {
      timerMode = timerMode === 3 ? 5 : 3;
      timerLabel.textContent = timerMode + ' Detik';
      startCountdown();
    });
  }

  if (camFlipToggle) {
    camFlipToggle.addEventListener('click', () => {
      if (previewImg) {
        previewImg.classList.toggle('scale-x-[-1]');
      }
    });
  }

  let flashActive = true;
  if (flashToggle) {
    flashToggle.addEventListener('click', () => {
      flashActive = !flashActive;
      const icon = flashToggle.querySelector('span');
      if (icon) {
        icon.textContent = flashActive ? 'flash_on' : 'flash_off';
      }
    });
  }

  function selectFilter(filterName, btnElement) {
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.className = 'filter-btn flex items-center gap-1.5 px-3.5 py-1.5 rounded-full bg-surface-container text-on-surface whitespace-nowrap active:scale-95 transition-all shadow-sm';
      const textSpan = btn.querySelector('span:nth-child(2)');
      if (textSpan) textSpan.classList.remove('font-bold');
    });

    btnElement.className = 'filter-btn flex items-center gap-1.5 px-3.5 py-1.5 rounded-full bg-primary-container text-on-primary whitespace-nowrap active:scale-95 transition-all shadow-md';
    const activeText = btnElement.querySelector('span:nth-child(2)');
    if (activeText) activeText.classList.add('font-bold');

    if (activeFilterBadge) {
      activeFilterBadge.textContent = filterName;
    }
  }

  startCountdown();
</script></main></body></html>
